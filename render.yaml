services:
  - type: web
    name: novapulse-api
    runtime: node
    rootDir: server
    buildCommand: npm install
    startCommand: node server.js
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: NOVAPULSE_SECRET
        generateValue: true
      - key: DATABASE_URL
        sync: false
